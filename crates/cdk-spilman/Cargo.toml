[package]
name = "cdk-spilman"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Standalone Spilman payment channels library for Cashu"
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
wallet = ["cashu/wallet"]
configurable-host = ["dep:serde_yml", "dep:rusqlite"]
configurable-host-reqwest = ["configurable-host", "dep:reqwest"]
spilman-axum = ["configurable-host", "dep:axum"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum = { workspace = true, optional = true, features = ["macros"] }
base64 = "0.22"
bitcoin.workspace = true
cashu = { workspace = true, default-features = false }
reqwest = { workspace = true, optional = true }
rusqlite = { version = "0.31", optional = true, features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
serde_yml = { version = "0.0.12", optional = true }
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true
