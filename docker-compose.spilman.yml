# CDK Spilman Channel Development Environment
#
# Uses a single devenv image with volume-mounted source code.
# Fast iteration: changes to source are picked up immediately.
#
# Uses host networking (--network=host) to work on VPS/cloud environments
# where bridge networking may be restricted. Services use high ports:
#   - Mint: 33380
#   - Rust ASCII Art Server: 50080
#
# Prerequisites (Podman):
#   podman build -f containers/Dockerfile.devenv -t cdk-devenv .
#
# Prerequisites (Docker):
#   docker build --network=host -f containers/Dockerfile.devenv -t cdk-devenv .
#
# Usage (Podman):
#   podman-compose -f docker-compose.spilman.yml up test-rust                    # Build + run all tests
#   podman-compose -f docker-compose.spilman.yml up --force-recreate test-rust   # Force fresh containers
#   podman-compose -f docker-compose.spilman.yml down -v                         # Clean up (including caches)
#
# Usage (Docker):
#   docker compose -f docker-compose.spilman.yml up test-rust                    # Build + run all tests
#   docker compose -f docker-compose.spilman.yml up --force-recreate test-rust   # Force fresh containers
#   docker compose -f docker-compose.spilman.yml down -v                         # Clean up (including caches)
#
# Or via Makefile (recommended - supports both Podman and Docker):
#   make test-rust-only-containerized              # Default: uses Podman
#   make test-rust-only-containerized CONTAINER_ENGINE=docker  # Use Docker

services:
  # ============================================================
  # Build step - compiles all binaries, then exits
  # ============================================================
  build:
    image: cdk-devenv
    network_mode: host
    volumes:
      - .:/app
      - cargo-cache:/usr/local/cargo/registry
      - target-cache:/app/target
    command: ["sh", "-c", "cargo build -p cdk-mintd --features fakewallet -p rust-ascii-art && cargo test -p cdk-spilman-server-integration-tests --test integration --no-run"]

  # ============================================================
  # CDK Mint Daemon
  # ============================================================
  mint:
    image: cdk-devenv
    network_mode: host
    volumes:
      - .:/app
      - target-cache:/app/target
    environment:
      CDK_MINTD_LISTEN_PORT: "33380"
    command: ./target/debug/cdk-mintd --config containers/mint-config.toml
    # Note: 'build' service is run separately via Makefile because
    # podman-compose 1.3.0 has issues with service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:33380/v1/info"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
    stop_grace_period: 1s

  # ============================================================
  # Rust ASCII Art Server
  # ============================================================
  rust-server:
    image: cdk-devenv
    network_mode: host
    volumes:
      - .:/app
      - target-cache:/app/target
    environment:
      PORT: "50080"
      MINT_URL: http://127.0.0.1:33380
    command: ./target/debug/rust-ascii-art
    depends_on:
      mint:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:50080/channel/params"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    stop_grace_period: 1s

  # ============================================================
  # Rust Integration Test Runner
  # ============================================================
  test-rust:
    image: cdk-devenv
    network_mode: host
    volumes:
      - .:/app
      - cargo-cache:/usr/local/cargo/registry
      - target-cache:/app/target
    environment:
      MINT_URL: http://127.0.0.1:33380
      SERVER_URL: http://127.0.0.1:50080
      SERVER_TYPE: rust
    command: cargo test -p cdk-spilman-server-integration-tests --test integration -- --nocapture
    depends_on:
      rust-server:
        condition: service_healthy

volumes:
  cargo-cache:
  target-cache:
