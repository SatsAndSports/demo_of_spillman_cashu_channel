# CDK Mint Configuration for Containerized Tests
#
# This config is mounted into the cdk-mintd container.
# Uses SQLite for simplicity and FakeWallet for testing.

[info]
# Use 0.0.0.0 to listen on all interfaces in container
url = "http://mint:3338"
listen_host = "0.0.0.0"
listen_port = 3338

# Fixed mnemonic for reproducible keyset IDs across container restarts
# This ensures tests don't break when containers restart
mnemonic = "abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about"

# Input fee for realistic testing (400 ppk = 0.4% = 4 sats per 1000 sats input)
input_fee_ppk = 400

[info.logging]
output = "stderr"
console_level = "info"

[mint_info]
name = "CDK Container Mint"
description = "CDK mint in container for Spilman channel testing"

[ln]
ln_backend = "fakewallet"
min_mint = 1
max_mint = 1000000
min_melt = 1
max_melt = 1000000

[fake_wallet]
# Support multiple units for testing different scenarios
supported_units = ["sat", "msat", "usd"]
fee_percent = 0.0
reserve_fee_min = 0
# Fast auto-payment for testing (1-3 seconds)
min_delay_time = 1
max_delay_time = 3

[database]
engine = "sqlite"
# Database will be created in /data/cdk-mintd.sqlite
