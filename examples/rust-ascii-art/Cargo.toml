[package]
name = "rust-ascii-art"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rust ASCII Art demo server for Spilman payment channels"

[[bin]]
name = "rust-ascii-art"
path = "src/main.rs"

[dependencies]
cdk = { workspace = true, default-features = false, features = ["spilman-axum", "configurable-host-reqwest"] }
axum = { workspace = true }
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
figlet-rs = "0.1"
base64 = "0.22"
hex = "0.4"

[dev-dependencies]
# reqwest with blocking for tests (already in deps, but explicit for clarity)

[[test]]
name = "integration"
path = "tests/integration.rs"
